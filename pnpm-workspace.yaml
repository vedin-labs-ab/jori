packages: []

# A version has to be a day old before it can be installed, so a compromised
# release is caught before it lands here. Delays legitimate bumps by a day.
minimumReleaseAge: 1440

overrides:
  # The Convex adapter requires Better Auth <1.7; keep its UI peers aligned.
  # UI stays at 1.6.31: later releases add an OAuth provider needing Auth 1.7
  # for GHSA-p2fr-6hmx-4528. Vitest also stays on Auth 1.6's supported v4.
  '@better-auth/api-key': 1.6.31
  '@better-auth/passkey': 1.6.31
  '@opentelemetry/core': 2.11.0
  '@hey-api/json-schema-ref-parser>js-yaml': 4.3.2
  'giget>tar': 7.5.22
  tsconfck: 3.1.6
  ws: 8.21.3

peerDependencyRules:
  allowedVersions:
    'tsconfck>typescript': ^6.0.0

allowBuilds:
  esbuild: true
  lightningcss: true
  unrs-resolver: true
  msw: false
  '@depot/cli': false
  '@openrouter/sdk': false
  bufferutil: false
  utf-8-validate: false
  core-js: false
