version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Revisit when @convex-dev/better-auth supports Better Auth 1.7.
      - dependency-name: better-auth
        versions: [">=1.7.0"]
      - dependency-name: "@better-auth/*"
        versions: [">=1.7.0"]
      # Later UI releases require an OAuth provider whose security fix needs 1.7.
      - dependency-name: "@better-auth-ui/*"
        versions: [">1.6.31"]
      # Better Auth 1.6 supports Vitest through v4.
      - dependency-name: vitest
        versions: [">=5.0.0"]
      # Focus regression closes menus: https://github.com/jsdom/jsdom/issues/4347
      - dependency-name: jsdom
        versions: ["30.1.0"]
    groups:
      authentication:
        patterns: ["better-auth", "@better-auth/*", "@better-auth-ui/*", "@convex-dev/better-auth"]
      router:
        patterns: ["@tanstack/react-router", "@tanstack/react-router-devtools", "@tanstack/react-start"]
      tiptap:
        patterns: ["@tiptap/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
